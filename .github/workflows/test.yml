name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        run: forge build
        env:
          FOUNDRY_PROFILE: ci
      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci
